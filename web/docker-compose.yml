services:
  web:
    build: .
    image: happyvote-aztec-web:local
    container_name: happyvote-web
    init: true
    env_file: .env
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.0
    environment:
      PORT: "4188"
      HOST: "0.0.0.0"
      NODE_ENV: production
      HAPPYVOTE_DATA_DIR: /data/happyvote
    volumes:
      - happyvote-data:/data/happyvote
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - happyvote

networks:
  happyvote:
    name: happyvote-aztec
    external: true

volumes:
  happyvote-data:
