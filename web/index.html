  <body>
    <div id="root"></div>
    <script>
      function showBootError(message) {
        var root = document.getElementById("root");
        if (!root) return;
        var pre = document.createElement("pre");
        pre.style.cssText =
          "padding:1.5rem;color:#f87171;font-family:monospace;white-space:pre-wrap";
        pre.textContent = String(message);
        root.replaceChildren(pre);
      }
      window.addEventListener("error", function (event) {
        showBootError(event.error && event.error.stack ? event.error.stack : event.message);
      });
      window.addEventListener("unhandledrejection", function (event) {
        var reason = event.reason;
        showBootError(reason && reason.stack ? reason.stack : reason && reason.message ? reason.message : String(reason));
      });
    </script>
